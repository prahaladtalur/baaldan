media:
  input: assets/img/uploads
  output: /assets/img/uploads
  rename: safe
  categories: [image]

settings:
  content:
    merge: true
  commit:
    templates:
      create: "content: add {name}"
      update: "content: update {name}"
      delete: "content: remove {name}"

content:
  - name: testimonials
    label: Donor testimonials
    type: collection
    path: content/testimonials
    format: json
    filename:
      template: "{fields.slug}.json"
      field: create
    view:
      primary: name
      fields: [name, role, featured, published]
      search: [name, role, quote]
      sort: [order, name]
    fields:
      - name: slug
        label: Record slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role / organization
        type: string
        required: true
      - name: quote
        label: Quote
        type: text
        required: true
      - name: featured
        label: "Feature on home page (rotating slider)"
        type: boolean
        required: true
      - name: order
        label: Display order
        type: number
        required: true
      - name: published
        label: Show on website
        type: boolean
        required: true

  - name: news
    label: News from the field
    type: collection
    path: content/news
    format: json
    filename:
      template: "{fields.slug}.json"
      field: create
    view:
      primary: title
      fields: [title, date, published]
      search: [title, body, date]
      sort: [order, date]
    fields:
      - name: slug
        label: Record slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: date
        label: "Date (as displayed, e.g. \"July 1, 2026\")"
        type: string
        required: true
      - name: title
        label: Headline
        type: string
        required: true
      - name: body
        label: Body
        type: text
        required: true
      - name: order
        label: Display order
        type: number
        required: true
      - name: published
        label: Show on website
        type: boolean
        required: true

  - name: partners
    label: Grantee partners
    type: collection
    path: content/partners
    format: json
    filename:
      template: "{fields.slug}.json"
      field: create
    view:
      primary: name
      fields: [name, tag, published]
      search: [name, tag, description]
      sort: [order, name]
    fields:
      - name: slug
        label: Record slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: name
        label: Partner name
        type: string
        required: true
      - name: tag
        label: "Location tag (may include &middot; separators)"
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: order
        label: Display order
        type: number
        required: true
      - name: published
        label: Show on website
        type: boolean
        required: true

  - name: countries
    label: Countries where we work
    type: collection
    path: content/countries
    format: json
    filename:
      template: "{fields.slug}.json"
      field: create
    view:
      primary: name
      fields: [name, show_on_home, published]
      search: [name]
      sort: [programs_order, name]
    fields:
      - name: slug
        label: URL slug
        type: string
        required: true
        pattern: "^[a-z0-9-]+$"
      - name: name
        label: Country name
        type: string
        required: true
      - name: flag
        label: Flag emoji
        type: string
        required: true
      - name: published
        label: Show on website
        type: boolean
        required: true
      - name: programs_details
        label: "Programs page: WASH / grant details"
        type: text
        required: true
      - name: programs_order
        label: "Programs page: display order"
        type: number
        required: true
      - name: show_on_home
        label: "Feature in the homepage teaser grid"
        type: boolean
        required: true
      - name: home_blurb
        label: "Homepage teaser: short blurb"
        type: string
        description: Required only when "Feature in the homepage teaser grid" is on.
      - name: home_order
        label: "Homepage teaser: display order"
        type: number
        description: Required only when "Feature in the homepage teaser grid" is on.

  # Each page below is a standalone file (not a repeating collection) because every
  # page has its own fixed set of text fields, not a uniform record shape. Add a new
  # "type: file" entry here (with a matching content/pages/<slug>.json) for any new
  # page that needs CMS-editable text.
