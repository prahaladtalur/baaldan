backend:
  name: github
  repo: prahaladtalur/baaldan
  branch: main
  # base_url / auth_endpoint are left at their defaults (https://api.netlify.com/auth),
  # which is Netlify's shared OAuth relay. See README.md > "Editing content" for the
  # one-time setup needed to make that relay work for this repo.

publish_mode: simple
media_folder: "assets/img/uploads"
public_folder: "/assets/img/uploads"

collections:
  - name: "content"
    label: "Site Content"
    files:
      - file: "assets/data/content.json"
        label: "Impact Stats, Testimonials, News & Event"
        name: "site_content"
        fields:
          - label: "Impact Stats"
            name: "stats"
            widget: object
            fields:
              - { label: "Children Supported (total)", name: "childrenSupported", widget: number, value_type: int }
              - { label: "Countries Reached", name: "countries", widget: number, value_type: int }
              - { label: "Overhead Rate (%)", name: "overheadPercent", widget: number, value_type: float }
              - { label: "Granted Per Year ($)", name: "grantsPerYear", widget: number, value_type: int }
              - { label: "Children Fed Daily", name: "childrenFedDaily", widget: number, value_type: int }
              - { label: "Years Active", name: "yearsActive", widget: number, value_type: int }

          - label: "Upcoming Event"
            name: "event"
            widget: object
            fields:
              - { label: "Date", name: "dateLabel", widget: string }
              - { label: "Event Name", name: "title", widget: string }
              - { label: "Description", name: "description", widget: text }
              - { label: "Button Text", name: "ctaLabel", widget: string }
              - { label: "Button Link", name: "ctaHref", widget: string }

          - label: "Testimonials"
            name: "testimonials"
            widget: list
            summary: "{{name}}, {{role}}"
            fields:
              - { label: "Quote", name: "quote", widget: text }
              - { label: "Name", name: "name", widget: string }
              - { label: "Role / Organization", name: "role", widget: string }
              - { label: "Feature on home page", name: "featured", widget: boolean, default: false }

          - label: "News From the Field"
            name: "news"
            widget: list
            summary: "{{date}}: {{title}}"
            fields:
              - { label: "Date", name: "date", widget: string }
              - { label: "Headline", name: "title", widget: string }
              - { label: "Body", name: "body", widget: text }
